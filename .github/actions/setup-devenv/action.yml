name: Set up devenv
description: Install Nix and devenv, and cache the pnpm store between runs.
inputs:
  cache-pnpm:
    description: Cache the pnpm store, keyed on pnpm-lock.yaml.
    default: "true"
  unprivileged-userns:
    description: Allow unprivileged user namespaces, which rootless Podman and Chromium need on Ubuntu 24.04.
    default: "false"
runs:
  using: composite
  steps:
    - name: Allow unprivileged user namespaces
      if: inputs.unprivileged-userns == 'true'
      shell: bash
      run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: devenv
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/nix
        key: nix-fetch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', '.github/actions/setup-devenv/action.yml') }}
        restore-keys: nix-fetch-${{ runner.os }}-${{ runner.arch }}-
    - name: Install devenv from the locked nixpkgs
      shell: bash
      run: nix profile add "$(jq -r '.nodes[.nodes.root.inputs.nixpkgs].locked | "github:\(.owner)/\(.repo)/\(.rev)#devenv"' devenv.lock)"
    - name: Point pnpm at a cached store
      if: inputs.cache-pnpm == 'true'
      shell: bash
      run: echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.cache-pnpm == 'true'
      with:
        path: ${{ runner.temp }}/pnpm-store
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
