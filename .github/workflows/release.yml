name: release

on:
  push:
    tags: ["v[0-9]*"]

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  IMAGE: ghcr.io/kyanitehq/threadsift

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.repository == 'KyaniteHQ/threadsift'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-devenv
        with:
          unprivileged-userns: "true"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf %s "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - id: image
        name: Build and push the architecture with provenance
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Start check on the published digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: devenv shell -- tools/start-check.sh "$IMAGE@$DIGEST"
      - if: matrix.arch == 'amd64'
        name: Install the smoke dependencies
        run: devenv tasks run ci:install
      - if: matrix.arch == 'amd64'
        name: Container smoke on the published digest
        env:
          THREADSIFT_TARGET: container
          THREADSIFT_IMAGE: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
        run: devenv shell -- pnpm exec playwright test --project=smoke
      - name: Record the checked digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: release-failure-${{ matrix.arch }}
          path: |
            test-results
            smoke-evidence
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: build
    if: github.repository == 'KyaniteHQ/threadsift'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf %s "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish the version tag and inspect its platforms and attestations
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          amd64=$(cat "$RUNNER_TEMP/digests/amd64")
          arm64=$(cat "$RUNNER_TEMP/digests/arm64")
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$amd64" "$IMAGE@$arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          docker buildx imagetools inspect --raw "$IMAGE:$VERSION" > "$RUNNER_TEMP/release-manifest.json"
          jq --exit-status '
            ([.manifests[].platform | select(.os == "linux") | .architecture] | sort) == ["amd64", "arm64"] and
            ([.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length) == 2
          ' "$RUNNER_TEMP/release-manifest.json"
      - name: Move the release branch to the tagged commit
        run: |
          git push origin "$GITHUB_SHA:refs/heads/release"
          [ "$(git ls-remote origin refs/heads/release | cut -f1)" = "$GITHUB_SHA" ]
