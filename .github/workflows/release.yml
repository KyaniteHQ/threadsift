name: release

on:
  push:
    tags: ["v[0-9]*"]

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  IMAGE: ghcr.io/kyanitehq/threadsift

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.repository == 'KyaniteHQ/threadsift'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Validate the image tag
        env:
          VERSION: ${{ github.ref_name }}
        run: '[[ "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tagged commit belongs to main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: ./.github/actions/setup-devenv
        with:
          unprivileged-userns: "true"
          cache-pnpm: ${{ matrix.arch == 'amd64' }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf %s "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - id: image
        name: Build and push the architecture with provenance
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Record the pushed digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-pushed-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/digests
          retention-days: 7
      - name: Start check on the published digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: devenv shell -- tools/start-check.sh "$IMAGE@$DIGEST"
      - if: matrix.arch == 'amd64'
        name: Install the smoke dependencies
        run: devenv tasks run ci:install
      - if: matrix.arch == 'amd64'
        name: Container smoke on the published digest
        env:
          THREADSIFT_TARGET: container
          THREADSIFT_IMAGE: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
        run: devenv shell -- pnpm exec playwright test --project=smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-checked-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: release-failure-${{ matrix.arch }}
          path: |
            test-results
            smoke-evidence
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: build
    if: github.repository == 'KyaniteHQ/threadsift'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the release branch can advance
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/release; then
            git merge-base --is-ancestor origin/release "$GITHUB_SHA"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-checked-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf %s "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Validate the index before publishing the version tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          amd64=$(cat "$RUNNER_TEMP/digests/amd64")
          arm64=$(cat "$RUNNER_TEMP/digests/arm64")
          docker buildx imagetools create --dry-run --tag "$IMAGE:$VERSION" "$IMAGE@$amd64" "$IMAGE@$arm64" > "$RUNNER_TEMP/release-manifest.json"
          jq --exit-status '
            ([.manifests[].platform | select(.os == "linux") | .architecture] | sort) == ["amd64", "arm64"] and
            ([.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length) == 2
          ' "$RUNNER_TEMP/release-manifest.json"
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$amd64" "$IMAGE@$arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - name: Move the release branch to the tagged commit
        run: |
          git push origin "$GITHUB_SHA:refs/heads/release"
          [ "$(git ls-remote origin refs/heads/release | cut -f1)" = "$GITHUB_SHA" ]
