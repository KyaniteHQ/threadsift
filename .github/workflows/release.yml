name: release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Sign in to both Extension stores and upload nothing; a real upload runs only for a pushed tag
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  IMAGE: ghcr.io/kyanitehq/threadsift

defaults:
  run:
    shell: bash

jobs:
  plan:
    if: github.repository == 'KyaniteHQ/threadsift' && github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decide what the tag moves
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tools/release-plan.sh "$TAG" > "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP/plan.txt"
          printf '~~~text\n%s\n~~~\n' "$(cat "$RUNNER_TEMP/plan.txt")" >> "$GITHUB_STEP_SUMMARY"

  extension:
    if: github.repository == 'KyaniteHQ/threadsift'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-devenv
      - name: Build and check the store zips and the source archive
        run: devenv tasks run extension:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-files
          path: extension/.output/*.zip
          if-no-files-found: error
          retention-days: 7

  build:
    needs: plan
    if: github.repository == 'KyaniteHQ/threadsift'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tagged commit belongs to main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: ./.github/actions/setup-devenv
        with:
          unprivileged-userns: "true"
          cache-pnpm: ${{ matrix.arch == 'amd64' }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf %s "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - id: image
        name: Build and push the architecture with provenance
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Record the pushed digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-pushed-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/digests
          retention-days: 7
      - name: Start check on the published digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: devenv shell -- tools/start-check.sh "$IMAGE@$DIGEST"
      - if: matrix.arch == 'amd64'
        name: Install the smoke dependencies
        run: devenv tasks run ci:install
      - if: matrix.arch == 'amd64'
        name: Container smoke on the published digest
        env:
          THREADSIFT_TARGET: container
          THREADSIFT_IMAGE: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
        run: devenv shell -- pnpm exec playwright test --project=smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-checked-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: release-failure-${{ matrix.arch }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [build, extension]
    if: github.repository == 'KyaniteHQ/threadsift'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
      packages: write
    outputs:
      submit_stores: ${{ steps.plan.outputs.submit_stores }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        name: Decide what the tag moves
        env:
          TAG: ${{ github.ref_name }}
        run: tools/release-plan.sh "$TAG" --outputs "$GITHUB_OUTPUT" --notes "$RUNNER_TEMP/notes.md"
      - if: steps.plan.outputs.move_release == 'true'
        name: Check the release branch can advance
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/release; then
            git merge-base --is-ancestor origin/release "$GITHUB_SHA"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-checked-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-files
          path: ${{ runner.temp }}/release-files
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf %s "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Validate the index, then publish the version tag and the moving tags
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          IMAGE_TAGS: ${{ steps.plan.outputs.image_tags }}
        run: |
          amd64=$(cat "$RUNNER_TEMP/digests/amd64")
          arm64=$(cat "$RUNNER_TEMP/digests/arm64")
          read -r -a names <<< "$IMAGE_TAGS"
          if published=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' 2> "$RUNNER_TEMP/version-tag.err"); then
            jq --exit-status --arg amd64 "$amd64" --arg arm64 "$arm64" '
              ([.manifests[] | select(.platform.os == "linux") | .digest] | sort) == ([$amd64, $arm64] | sort)
            ' <<< "$published" > /dev/null || {
              echo "$IMAGE:$VERSION already names other images than this run built; rerun only the failed publish job, which reuses the recorded digests" >&2
              exit 1
            }
          elif ! grep --quiet --line-regexp --fixed-strings "ERROR: $IMAGE:$VERSION: not found" "$RUNNER_TEMP/version-tag.err"; then
            cat "$RUNNER_TEMP/version-tag.err" >&2
            exit 1
          fi
          tags=()
          for name in "${names[@]}"; do
            tags+=(--tag "$IMAGE:$name")
          done
          docker buildx imagetools create --dry-run "${tags[@]}" "$IMAGE@$amd64" "$IMAGE@$arm64" > "$RUNNER_TEMP/release-manifest.json"
          jq --exit-status '
            ([.manifests[].platform | select(.os == "linux") | .architecture] | sort) == ["amd64", "arm64"] and
            ([.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length) == 2
          ' "$RUNNER_TEMP/release-manifest.json"
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$amd64" "$IMAGE@$arm64"
          index_digest() {
            docker buildx imagetools inspect "$IMAGE:$1" --format '{{json .Manifest}}' | jq --raw-output .digest
          }
          index=$(index_digest "$VERSION")
          for name in "${names[@]}"; do
            [ "$(index_digest "$name")" = "$index" ]
          done
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - if: steps.plan.outputs.move_release == 'true'
        name: Move the release branch to the tagged commit
        run: |
          git push origin "$GITHUB_SHA:refs/heads/release"
          [ "$(git ls-remote origin refs/heads/release | cut -f1)" = "$GITHUB_SHA" ]
      - name: Create the GitHub Release as a draft, attach its files, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.plan.outputs.title }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
          MOVE_RELEASE: ${{ steps.plan.outputs.move_release }}
          RELEASE_FILES: ${{ steps.plan.outputs.release_files }}
          NOTES_START_TAG: ${{ steps.plan.outputs.notes_start_tag }}
        run: |
          read -r -a names <<< "$RELEASE_FILES"
          expected=$(printf '%s\n' "${names[@]}" | sed '/^$/d' | sort)
          uploaded() {
            gh release view "$TAG" --json assets --jq '.assets[] | select(.state == "uploaded") | .name' | sort
          }
          mkdir -p "$RUNNER_TEMP/release-files"
          [ "$(find "$RUNNER_TEMP/release-files" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)" = "$expected" ] || {
            echo "The release files folder does not hold exactly the files the plan names: ${RELEASE_FILES:-none}" >&2
            exit 1
          }
          files=()
          for name in "${names[@]}"; do
            files+=("$RUNNER_TEMP/release-files/$name")
          done
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> "$RUNNER_TEMP/release-view.err"); then
            if [ "$draft" = false ]; then
              [ "$(uploaded)" = "$expected" ] || {
                echo "The published GitHub Release $TAG does not carry exactly the files the plan names: ${RELEASE_FILES:-none}" >&2
                exit 1
              }
              echo "The GitHub Release $TAG is already published with the files the plan names"
              exit 0
            fi
            gh release delete "$TAG" --yes
          elif ! grep --quiet --line-regexp 'release not found' "$RUNNER_TEMP/release-view.err"; then
            cat "$RUNNER_TEMP/release-view.err" >&2
            exit 1
          fi
          options=(--draft --verify-tag --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes --prerelease="$PRERELEASE")
          [ -z "$NOTES_START_TAG" ] || options+=(--notes-start-tag "$NOTES_START_TAG")
          gh release create "$TAG" "${options[@]}" "${files[@]}"
          [ "$(uploaded)" = "$expected" ] || {
            echo "The draft of $TAG does not list every file the plan names as uploaded, so it stays a draft: ${RELEASE_FILES:-none}" >&2
            exit 1
          }
          gh release edit "$TAG" --draft=false --latest="$MOVE_RELEASE"

  stores:
    needs: [extension, publish]
    if: >-
      !cancelled() && github.repository == 'KyaniteHQ/threadsift' && needs.extension.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.publish.outputs.submit_stores == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: extension-stores
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-devenv
      - name: Install the store client
        run: devenv tasks run ci:install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-files
          path: extension/.output
      - id: google
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        name: Get a one-hour Chrome Web Store token for the service account
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CHROME_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false
      - name: Submit the Extension to both stores, or sign in only for a dry run
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          TAG: ${{ github.ref_name }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_SERVICE_ACCOUNT_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            devenv shell -- node tools/extension-stores.ts submit --dry-run
          else
            devenv shell -- node tools/extension-stores.ts submit "$TAG"
          fi
