name: check

on: workflow_call

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.impeccable/bin
          key: impeccable-engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.claude/skills/impeccable/scripts/VERSION') }}
      - uses: ./.github/actions/setup-devenv
      - run: devenv tasks run ci:check
      - run: tools/docs-skip.sh delete
      - run: devenv tasks run ci:test ci:build ci:audit design:check
        env:
          THREADSIFT_JUNIT_DIR: ${{ runner.temp }}/core-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: core-tests
          path: ${{ runner.temp }}/core-tests
          if-no-files-found: warn
          retention-days: 7
