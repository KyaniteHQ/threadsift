name: update devenv.lock

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  update:
    if: github.repository == 'KyaniteHQ/threadsift'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: chore/update-devenv-lock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-devenv
        with:
          cache-pnpm: "false"
      - run: devenv update
      - id: diff
        run: |
          if git diff --quiet -- devenv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git commit --message "chore(deps): update devenv.lock" -- devenv.lock
          git push --force origin "$BRANCH"
          if [[ -z $(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number') ]]; then
            gh pr create --head "$BRANCH" --base main \
              --title "chore(deps): update devenv.lock" \
              --body "\`devenv update\` moved \`devenv.lock\`. A pull request opened with \`GITHUB_TOKEN\` holds its \`pull_request\` runs for approval, so the workflow approves the \`gate\` run on each head it pushes."
          fi
          head=$(git rev-parse HEAD)
          for _ in $(seq 1 30); do
            runs=$(gh run list --branch "$BRANCH" --event pull_request --commit "$head" --json databaseId,status --jq '.[] | "\(.databaseId) \(.status)"')
            [[ -n $runs ]] && break
            sleep 10
          done
          [[ -n $runs ]] || { echo "no pull_request run started on $head"; exit 1; }
          while read -r run status; do
            if [[ $status == action_required ]]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/approve"
            fi
          done <<< "$runs"
