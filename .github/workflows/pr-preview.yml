name: pr-preview

on:
  workflow_run:
    workflows: [bundle]
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Closed pull request to clean up (empty sweeps closed previews)
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  select:
    if: github.repository == 'KyaniteHQ/threadsift' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
      pull-requests: read
    outputs:
      previews: ${{ steps.select.outputs.previews }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-devenv
      - run: devenv tasks run ci:install
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previews=$(devenv shell -- node tools/preview-selection.ts)
          echo "previews=$previews" >> "$GITHUB_OUTPUT"

  preview:
    needs: select
    if: needs.select.outputs.previews != '[]'
    strategy:
      fail-fast: false
      matrix:
        preview: ${{ fromJSON(needs.select.outputs.previews) }}
    concurrency:
      group: preview-${{ matrix.preview.pr }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: preview
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-devenv
      - run: devenv tasks run ci:install
      - id: current
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ matrix.preview.pr }}
          SHA: ${{ matrix.preview.sha }}
          OPERATION: ${{ matrix.preview.operation }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > "$RUNNER_TEMP/pr.json"
          if [ "$OPERATION" = close ]; then
            if jq -e '.state == "closed"' "$RUNNER_TEMP/pr.json" >/dev/null; then
              echo 'operation=close' >> "$GITHUB_OUTPUT"
            fi
          elif jq -e --arg sha "$SHA" --arg repo "$GITHUB_REPOSITORY" '.state == "open" and .head.sha == $sha and .head.repo.full_name == $repo' "$RUNNER_TEMP/pr.json" >/dev/null; then
            echo 'operation=deploy' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.current.outputs.operation == 'deploy'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pr-preview
          path: ${{ runner.temp }}/pr-preview
          run-id: ${{ matrix.preview.run }}
          github-token: ${{ github.token }}
      - id: deployment
        if: steps.current.outputs.operation == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ matrix.preview.pr }}
          SHA: ${{ matrix.preview.sha }}
        run: |
          jq -n --arg ref "$SHA" --arg environment "pr-$PR" '{ref:$ref,environment:$environment,auto_merge:false,required_contexts:[],transient_environment:true,production_environment:false}' > "$RUNNER_TEMP/deployment.json"
          id=$(gh api "repos/$GITHUB_REPOSITORY/deployments" --input "$RUNNER_TEMP/deployment.json" --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=in_progress >/dev/null
      - if: steps.current.outputs.operation != ''
        name: Apply the PR resource manifest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEMO_OWNER_PASSWORD: ${{ secrets.DEMO_OWNER_PASSWORD }}
          PREVIEW_SETUP_CODE: ${{ secrets.PREVIEW_SETUP_CODE }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/preview-output.jsonl
          PR: ${{ matrix.preview.pr }}
          OPERATION: ${{ steps.current.outputs.operation }}
          ARTIFACT: ${{ runner.temp }}/pr-preview
        run: |
          args=()
          if [ "$OPERATION" = deploy ]; then args=("$ARTIFACT"); fi
          devenv shell -- node tools/pr-preview.ts "$OPERATION" "$PR" --apply "${args[@]}"
      - if: always() && steps.deployment.outputs.id != ''
        name: Publish the deployment result
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ steps.deployment.outputs.id }}
          RESULT: ${{ job.status }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/preview-output.jsonl
        run: |
          if [ "$RESULT" = success ]; then
            url=$(jq -rs '[.[] | select(.type == "deploy") | .targets[] | select(startswith("https://"))] | last' "$WRANGLER_OUTPUT_FILE_PATH")
            [[ "$url" == https://*.workers.dev ]]
            gh api "repos/$GITHUB_REPOSITORY/deployments/$ID/statuses" -f state=success -f environment_url="$url" -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/deployments/$ID/statuses" -f state=failure -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          fi
      - if: steps.current.outputs.operation == 'close' && success()
        name: Mark closed preview deployments inactive
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ matrix.preview.pr }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/deployments?environment=pr-$PR&per_page=100" --paginate --jq '.[].id' > "$RUNNER_TEMP/deployments.txt"
          while read -r id; do
            gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=inactive >/dev/null
          done < "$RUNNER_TEMP/deployments.txt"
