name: Update from upstream

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash

jobs:
  update:
    if: github.repository != 'KyaniteHQ/threadsift'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: update-from-upstream
    env:
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check UPDATE_TOKEN
        id: check_UPDATE_TOKEN
        env:
          GH_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: test -n "$GH_TOKEN"
      - id: checkout_copy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASE }}
          persist-credentials: false
      - name: Fetch the upstream release branch
        id: fetch_upstream_release
        run: git fetch --no-tags --depth=1 https://github.com/KyaniteHQ/threadsift.git refs/heads/release
      - id: setup_node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Prepare the release tree with the copy's bindings
        id: prepare_update
        run: |
          work="$RUNNER_TEMP/update"
          mkdir -p "$work"
          npm install --prefix "$work" --ignore-scripts --no-audit --no-fund jsonc-parser@3.3.1 zod@4.6.7
          release=$(git rev-parse FETCH_HEAD)
          cp tools/update-bindings.ts "$work/update-bindings.mts"
          git show HEAD:wrangler.jsonc > "$work/copy.jsonc"
          git show "$release:wrangler.jsonc" > "$work/release.jsonc"
          printf 'Review the changes from upstream release %s before merging.\n' "$release" > "$work/body.md"
          node "$work/update-bindings.mts" "$work/copy.jsonc" "$work/release.jsonc" "$work/body.md"
          git read-tree "$release"
          blob=$(git hash-object -w "$work/release.jsonc")
          git update-index --cacheinfo "100644,$blob,wrangler.jsonc"
          if ! git diff --cached --quiet; then
            echo "branch=threadsift-update/$(git rev-parse HEAD)-$release" >> "$GITHUB_OUTPUT"
          fi
      - name: Open the update pull request
        id: open_pull_request
        if: steps.prepare_update.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.UPDATE_TOKEN }}
          BRANCH: ${{ steps.prepare_update.outputs.branch }}
        run: |
          gh auth setup-git
          if ! git ls-remote --exit-code origin "refs/heads/$BRANCH" > /dev/null; then
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Update Threadsift from upstream release"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          existing=$(gh pr list --base "$BASE" --head "$BRANCH" --state all --json number --jq '.[0].number // empty')
          if [[ -z "$existing" ]]; then
            gh pr create --base "$BASE" --head "$BRANCH" --title "Update Threadsift from upstream release" --body-file "$RUNNER_TEMP/update/body.md"
          fi
      - name: Report the failed step
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          STEPS: ${{ toJSON(steps) }}
        run: |
          cause=$(jq -r 'to_entries[] | select(.value.outcome == "failure") | .key | if . == "check_UPDATE_TOKEN" then "find UPDATE_TOKEN" else gsub("_"; " ") end' <<< "$STEPS")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Threadsift update failed to $cause" --body "See the failed step in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
