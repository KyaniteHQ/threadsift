name: gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to ghcr.io and move the `main` tag. Off builds both architectures, runs the start check and pushes nothing.
        type: boolean
        default: false

concurrency:
  group: gate-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/kyanitehq/threadsift

jobs:
  check:
    if: github.repository == 'KyaniteHQ/threadsift'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.impeccable/bin
          key: impeccable-engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.claude/skills/impeccable/scripts/VERSION') }}
      - uses: ./.github/actions/setup-devenv
      - run: devenv tasks run ci:gate

  smoke:
    if: github.repository == 'KyaniteHQ/threadsift'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [worker, container]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-devenv
        with:
          unprivileged-userns: "true"
      - id: layer-cache
        if: matrix.target == 'container'
        uses: ./.github/actions/layer-cache-restore
      - env:
          THREADSIFT_LAYER_CACHE: ${{ (github.event_name == 'push' || steps.layer-cache.outputs.cache-hit == 'true') && steps.layer-cache.outputs.path || '' }}
        run: devenv tasks run smoke:${{ matrix.target }} --show-output
      - if: matrix.target == 'container' && github.event_name == 'push' && steps.layer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.layer-cache.outputs.path }}
          key: ${{ steps.layer-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: smoke-${{ matrix.target }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  gate:
    needs: [check, smoke]
    if: always() && github.repository == 'KyaniteHQ/threadsift'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq --exit-status 'all(. == "success" or . == "skipped")' <<<"$RESULTS"

  deploy:
    needs: gate
    if: github.repository == 'KyaniteHQ/threadsift' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: live
    concurrency:
      group: live-deploy
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: head
        uses: ./.github/actions/main-head
      - if: steps.head.outputs.current == 'true'
        uses: ./.github/actions/setup-devenv
      - if: steps.head.outputs.current == 'true'
        run: devenv tasks run web:build
      - if: steps.head.outputs.current == 'true'
        name: Migrate the live database and deploy the live Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          devenv shell -- pnpm exec wrangler d1 migrations apply DB --remote --env live
          devenv shell -- pnpm exec wrangler deploy --env live --keep-vars
      - if: steps.head.outputs.current == 'true'
        name: Wait for the live Worker to answer 200
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          url=$(jq --raw-output --slurp 'map(select(.type == "deploy")) | .[0].targets[0]' "$WRANGLER_OUTPUT_FILE_PATH")
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --fail --max-time 20 --retry 10 --retry-delay 5 --retry-all-errors "${url%/}/api/session")
          [ "$code" = 200 ]

  image-head:
    needs: gate
    if: github.repository == 'KyaniteHQ/threadsift' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      current: ${{ steps.mode.outputs.current }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: head
        uses: ./.github/actions/main-head
      - id: mode
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          HEAD_CURRENT: ${{ steps.head.outputs.current }}
        run: |
          if [ "$PUBLISH" = true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Publishing needs a run on main, this one is on $GITHUB_REF" >&2
            exit 1
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = true ]; then
            echo "current=$HEAD_CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: image-head
    if: needs.image-head.outputs.current == 'true'
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image-${{ github.sha }}-${{ matrix.arch }}
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
      PUBLISH: ${{ needs.image-head.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-devenv
        with:
          cache-pnpm: "false"
          unprivileged-userns: "true"
      - if: env.PUBLISH == 'true'
        uses: ./.github/actions/ghcr-login
      - id: published
        if: env.PUBLISH == 'true'
        name: Look up the architecture image of this commit
        run: |
          digest=$(tools/image-digest.sh "$IMAGE:sha-$GITHUB_SHA-$ARCH")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - id: layer-cache
        if: matrix.arch == 'amd64' && steps.published.outputs.digest == ''
        uses: ./.github/actions/layer-cache-restore
      - if: steps.published.outputs.digest == ''
        name: Build the image
        env:
          THREADSIFT_LAYER_CACHE: ${{ steps.layer-cache.outputs.cache-hit == 'true' && steps.layer-cache.outputs.path || '' }}
        run: devenv tasks run image:build --show-output
      - if: env.PUBLISH != 'true'
        name: Start check on the local image
        run: devenv shell -- tools/start-check.sh localhost/threadsift:publish
      - if: env.PUBLISH == 'true'
        name: Push the image unless this commit has one, and start check on its digest
        shell: bash
        env:
          DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          if [ -z "$DIGEST" ]; then
            ref=$IMAGE:sha-$GITHUB_SHA-$ARCH
            devenv shell -- podman tag localhost/threadsift:publish "$ref"
            devenv shell -- podman push --digestfile "$RUNNER_TEMP/pushed-digest" "$ref"
            DIGEST=$(cat "$RUNNER_TEMP/pushed-digest")
          fi
          devenv shell -- podman image prune --all --force
          devenv shell -- tools/start-check.sh "$IMAGE@$DIGEST"
          printf %s "$DIGEST" > "$RUNNER_TEMP/digest-$ARCH"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest-${{ matrix.arch }}
          retention-days: 1

  image-publish:
    needs: [image-head, image]
    if: needs.image-head.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    concurrency:
      group: image-publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-devenv
        with:
          cache-pnpm: "false"
          unprivileged-userns: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: ./.github/actions/ghcr-login
      - id: manifest
        name: Make the multi-arch manifest from the checked digests unless this commit has one
        shell: bash
        run: |
          list=$IMAGE:sha-$GITHUB_SHA
          digest=$(tools/image-digest.sh "$list")
          if [ -z "$digest" ]; then
            devenv shell -- podman manifest create "$list"
            for arch in amd64 arm64; do
              devenv shell -- podman manifest add "$list" "docker://$IMAGE@$(cat "$RUNNER_TEMP/digests/digest-$arch")"
            done
            devenv shell -- podman manifest push --digestfile "$RUNNER_TEMP/manifest-digest" "$list" "docker://$list"
            digest=$(cat "$RUNNER_TEMP/manifest-digest")
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Start check on the manifest digest
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: devenv shell -- tools/start-check.sh "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - id: head
        uses: ./.github/actions/main-head
      - if: steps.head.outputs.current == 'true'
        name: Move the main tag to the manifest digest
        shell: bash
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          [ "$(tools/image-digest.sh "$IMAGE:sha-$GITHUB_SHA")" = "$DIGEST" ]
          skopeo copy --all --preserve-digests "docker://$IMAGE@$DIGEST" "docker://$IMAGE:main"
          [ "$(tools/image-digest.sh "$IMAGE:main")" = "$DIGEST" ]
