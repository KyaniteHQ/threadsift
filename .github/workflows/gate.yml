name: gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    if: github.repository == 'KyaniteHQ/threadsift'
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          docs_only=false
          range=()
          case "$EVENT" in
            pull_request) range=(HEAD^1 HEAD) ;;
            push) range=("$BEFORE" HEAD) ;;
          esac
          if [[ ${#range[@]} -gt 0 ]] && git diff --no-renames --name-only "${range[@]}" > changed.txt 2>/dev/null && [[ -s changed.txt ]]; then
            docs_only=true
            while IFS= read -r path; do
              if [[ $path == docs/* || ( $path != */* && $path == *.md ) ]]; then continue; fi
              docs_only=false
            done < changed.txt
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  check:
    if: github.repository == 'KyaniteHQ/threadsift'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-devenv
      - run: devenv tasks run ci:check

  build:
    if: github.repository == 'KyaniteHQ/threadsift'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-devenv
      - run: devenv tasks run ci:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: pr-copy
          path: |
            dist/web
            dist/worker/index.js
            migrations/*.sql
          if-no-files-found: error
          retention-days: 1

  audit:
    if: github.repository == 'KyaniteHQ/threadsift'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-devenv
      - run: devenv tasks run ci:audit

  design:
    if: github.repository == 'KyaniteHQ/threadsift'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: .claude/skills/impeccable/scripts/impeccable detect --github web

  e2e-container:
    needs: changes
    if: github.repository == 'KyaniteHQ/threadsift' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-devenv
      - name: Allow unprivileged user namespaces for rootless Podman and Chromium
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - run: devenv tasks run e2e:container
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-container
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  e2e-worker:
    needs: changes
    if: github.repository == 'KyaniteHQ/threadsift' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-devenv
      - name: Allow unprivileged user namespaces for Chromium
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - run: devenv tasks run e2e:worker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-worker
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  gate:
    needs: [changes, check, build, audit, design, e2e-container, e2e-worker]
    if: always() && github.repository == 'KyaniteHQ/threadsift'
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq --exit-status 'all(. == "success" or . == "skipped")' <<<"$RESULTS"
