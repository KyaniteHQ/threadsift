name: gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gate-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'KyaniteHQ/threadsift'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.impeccable/bin
          key: impeccable-engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.claude/skills/impeccable/scripts/VERSION') }}
      - uses: ./.github/actions/setup-devenv
      - run: devenv tasks run ci:gate

  smoke:
    if: github.repository == 'KyaniteHQ/threadsift'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [worker, container]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-devenv
      - name: Allow unprivileged user namespaces for rootless Podman and Chromium
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - run: devenv tasks run smoke:${{ matrix.target }} --show-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: smoke-${{ matrix.target }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  gate:
    needs: [check, smoke]
    if: always() && github.repository == 'KyaniteHQ/threadsift'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq --exit-status 'all(. == "success" or . == "skipped")' <<<"$RESULTS"

  deploy:
    needs: gate
    if: github.repository == 'KyaniteHQ/threadsift' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: live
    concurrency:
      group: live-deploy
      cancel-in-progress: false
      queue: max
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipped: main is at $current now"
          fi
      - if: steps.head.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.head.outputs.current == 'true'
        uses: ./.github/actions/setup-devenv
      - if: steps.head.outputs.current == 'true'
        run: devenv tasks run web:build
      - if: steps.head.outputs.current == 'true'
        name: Migrate the live database and deploy the live Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          devenv shell -- pnpm exec wrangler d1 migrations apply DB --remote --env live
          devenv shell -- pnpm exec wrangler deploy --env live --keep-vars
      - if: steps.head.outputs.current == 'true'
        name: Wait for the live Worker to answer 200
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          url=$(jq --raw-output --slurp 'map(select(.type == "deploy")) | .[0].targets[0]' "$WRANGLER_OUTPUT_FILE_PATH")
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --fail --max-time 20 --retry 10 --retry-delay 5 --retry-all-errors "${url%/}/api/session")
          [ "$code" = 200 ]

  live-check:
    needs: gate
    if: github.repository == 'KyaniteHQ/threadsift' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: post-merge
    strategy:
      fail-fast: false
      matrix:
        target: [worker, container]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-devenv
      - name: Allow unprivileged user namespaces for rootless Podman and Chromium
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: nvidia/nemotron-3.5-super-vl:free
        run: devenv tasks run live:${{ matrix.target }} --show-output
