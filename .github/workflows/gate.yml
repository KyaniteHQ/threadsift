name: gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to ghcr.io and move the `main` tag. Off builds amd64, runs the start check and pushes nothing.
        type: boolean
        default: false

concurrency:
  group: gate-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/kyanitehq/threadsift

jobs:
  changes:
    if: github.repository == 'KyaniteHQ/threadsift'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      mode: ${{ steps.tested.outputs.match == 'true' && 'tested' || steps.paths.outputs.docs_only == 'true' && (github.event_name != 'push' || steps.previous.outputs.delivered == 'true') && 'docs' || 'full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
        run: |
          docs_diff() {
            local paths="$RUNNER_TEMP/changed-paths"
            git diff --no-renames --name-only -z "$@" -- > "$paths" && [[ -s "$paths" ]] || return 1
            while IFS= read -r -d '' path; do
              case "$path" in
                AGENTS.md|README.md|docs/*.md|docs/assets/*.png|docs/assets/*.gif) ;;
                *) return 1 ;;
              esac
            done < "$paths"
          }
          if [[ -z "$BASE" ]] || ! docs_diff "$BASE" "$GITHUB_SHA"; then
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] && ! docs_diff --merge-base "$BASE" "$GITHUB_SHA^2"; then
            exit 0
          fi
          echo "docs_only=true" >> "$GITHUB_OUTPUT"
      - id: previous
        if: github.event_name == 'push' && !github.event.forced && steps.paths.outputs.docs_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          PUSHED_AT: ${{ github.event.repository.pushed_at }}
        shell: bash
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/gate.yml/runs?event=push&branch=main&head_sha=$BEFORE&per_page=1"
          if gh api "$runs" | jq -e --arg at "$PUSHED_AT" '
            .workflow_runs[0] | .conclusion == "success" and (.updated_at | fromdateiso8601) < ($at | tonumber)
          ' > /dev/null; then
            echo "delivered=true" >> "$GITHUB_OUTPUT"
          fi

      - id: tested
        if: github.event_name == 'push' && !github.event.forced && steps.paths.outputs.docs_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          if timeout 90s bash tools/tested-tree.sh; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "Running the full gate because the pull request checks could not be reused."
          fi

  docs:
    needs: changes
    if: needs.changes.outputs.mode == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-devenv
      - run: devenv tasks run ci:check

  check:
    needs: changes
    if: &full-gate >-
      !cancelled() && github.repository == 'KyaniteHQ/threadsift' &&
      (needs.changes.result != 'success' || needs.changes.outputs.mode != 'tested' && needs.changes.outputs.mode != 'docs')
    uses: ./.github/workflows/check.yml

  smoke:
    needs: changes
    if: *full-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [worker, container]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-devenv
        with:
          unprivileged-userns: "true"
      - run: devenv tasks run smoke:${{ matrix.target }} --show-output
        env:
          THREADSIFT_CACHE_FROM: ${{ matrix.target == 'container' && env.IMAGE || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: smoke-${{ matrix.target }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  gate:
    needs: [changes, docs, check, smoke]
    if: always() && github.repository == 'KyaniteHQ/threadsift'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq --exit-status '
            [.docs.result, .check.result, .smoke.result] as $jobs |
            if .changes.result != "success" or .changes.outputs.mode == "full" then
              $jobs == ["skipped", "success", "success"]
            elif .changes.outputs.mode == "docs" then
              $jobs == ["success", "skipped", "skipped"]
            else
              .changes.outputs.mode == "tested" and env.GITHUB_EVENT_NAME == "push" and
              $jobs == ["skipped", "skipped", "skipped"]
            end
          ' <<<"$RESULTS"

  deploy:
    needs: [changes, gate]
    if: >-
      !cancelled() && needs.gate.result == 'success' &&
      needs.changes.outputs.mode != 'docs' &&
      github.repository == 'KyaniteHQ/threadsift' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: live
    concurrency:
      group: live-deploy
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: head
        uses: ./.github/actions/main-head
      - if: steps.head.outputs.current == 'true'
        uses: ./.github/actions/setup-devenv
      - if: steps.head.outputs.current == 'true'
        run: devenv tasks run web:build
      - if: steps.head.outputs.current == 'true'
        name: Migrate the live database and deploy the live Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: devenv shell -- tools/live-deploy.sh

  image:
    needs: [changes, gate]
    if: >-
      !cancelled() && needs.gate.result == 'success' &&
      needs.changes.outputs.mode != 'docs' &&
      github.repository == 'KyaniteHQ/threadsift' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image-publish
      cancel-in-progress: false
      queue: max
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: head
        uses: ./.github/actions/main-head
      - id: mode
        env:
          HEAD_CURRENT: ${{ steps.head.outputs.current }}
        run: |
          if [ "$PUBLISH" = true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Publishing needs a run on main, this one is on $GITHUB_REF" >&2
            exit 1
          fi
          if [ "$PUBLISH" = true ]; then
            echo "current=$HEAD_CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.mode.outputs.current == 'true'
        uses: ./.github/actions/setup-devenv
        with:
          cache-pnpm: "false"
          unprivileged-userns: "true"
      - if: steps.mode.outputs.current == 'true' && env.PUBLISH == 'true'
        name: Log in to ghcr.io
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf %s "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - id: published
        if: steps.mode.outputs.current == 'true' && env.PUBLISH == 'true'
        name: Look up the image of this commit
        run: |
          digest=$(tools/image-digest.sh "$IMAGE:sha-$GITHUB_SHA")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - if: steps.mode.outputs.current == 'true' && steps.published.outputs.digest == ''
        name: Build the image
        env:
          THREADSIFT_CACHE_TO: ${{ env.PUBLISH == 'true' && github.ref == 'refs/heads/main' && env.IMAGE || '' }}
        run: devenv tasks run image:build --show-output
      - if: steps.mode.outputs.current == 'true' && env.PUBLISH != 'true'
        name: Start check on the local image
        run: devenv shell -- tools/start-check.sh localhost/threadsift:publish
      - id: checked
        if: steps.mode.outputs.current == 'true' && env.PUBLISH == 'true'
        name: Push the image unless this commit has one, and start check on its digest
        shell: bash
        env:
          DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          if [ -z "$DIGEST" ]; then
            ref=$IMAGE:sha-$GITHUB_SHA
            devenv shell -- podman tag localhost/threadsift:publish "$ref"
            devenv shell -- podman push --digestfile "$RUNNER_TEMP/pushed-digest" "$ref"
            DIGEST=$(cat "$RUNNER_TEMP/pushed-digest")
          fi
          devenv shell -- podman image prune --all --force
          devenv shell -- tools/start-check.sh "$IMAGE@$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - id: publish-head
        if: steps.mode.outputs.current == 'true' && env.PUBLISH == 'true'
        uses: ./.github/actions/main-head
      - if: steps.publish-head.outputs.current == 'true'
        name: Move the main tag to the checked digest
        shell: bash
        env:
          DIGEST: ${{ steps.checked.outputs.digest }}
        run: |
          [ "$(tools/image-digest.sh "$IMAGE:sha-$GITHUB_SHA")" = "$DIGEST" ]
          skopeo copy --preserve-digests "docker://$IMAGE@$DIGEST" "docker://$IMAGE:main"
          [ "$(tools/image-digest.sh "$IMAGE:main")" = "$DIGEST" ]
