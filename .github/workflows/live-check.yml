name: live check

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-check:
    if: github.repository == 'KyaniteHQ/threadsift' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: post-merge
    strategy:
      fail-fast: false
      matrix:
        target: [worker, container]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-devenv
        with:
          unprivileged-userns: "true"
      - id: layer-cache
        if: matrix.target == 'container'
        uses: ./.github/actions/layer-cache-restore
      - env:
          THREADSIFT_LAYER_CACHE: ${{ steps.layer-cache.outputs.cache-hit == 'true' && steps.layer-cache.outputs.path || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.target == 'container' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: devenv tasks run live:${{ matrix.target }} --show-output
