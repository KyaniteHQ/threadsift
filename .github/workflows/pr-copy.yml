name: pr copy

on:
  workflow_run:
    workflows: [gate]
    types: [completed]
  pull_request_target:
    types: [closed]

concurrency:
  group: pr-copy-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  check:
    if: >-
      github.repository == 'KyaniteHQ/threadsift' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Check that the gate ran on the pull request's current head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          if [ "$current" = "$HEAD_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes: pull request $PR is at $current now"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-devenv
      - run: devenv tasks run ci:install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-copy
          path: ${{ runner.temp }}/pr-copy
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Deploy the copy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEMO_OWNER_PASSWORD: ${{ secrets.DEMO_OWNER_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ runner.temp }}/pr-copy
        run: devenv shell -- node tools/pr-copy/cli.ts deploy --github --artifact "$ARTIFACT"

  delete:
    if: >-
      github.repository == 'KyaniteHQ/threadsift' &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    permissions:
      contents: read
      deployments: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-devenv
      - run: devenv tasks run ci:install
      - name: Delete the copy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: devenv shell -- node tools/pr-copy/cli.ts delete --github
