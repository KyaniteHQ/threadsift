name: live copy

on:
  workflow_run:
    workflows: [gate]
    types: [completed]

concurrency:
  group: threadsift-live
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  check:
    if: >-
      github.repository == 'KyaniteHQ/threadsift' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$HEAD_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes: main is at $current now"
          fi

  live:
    needs: check
    if: needs.check.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: live
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-devenv
      - run: devenv tasks run ci:install
      - run: devenv tasks run ci:build
      - name: Deploy the live copy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEMO_OWNER_PASSWORD: ${{ secrets.DEMO_OWNER_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: devenv shell -- node tools/pr-copy/cli.ts live --github --artifact "$GITHUB_WORKSPACE"
