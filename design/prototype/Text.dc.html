<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Text renderer</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<script src="./library.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tokens.css">
<style>
body{margin:0}
/* Text: paragraphs, headings, rules, quotes, both list types, code and tables. Every run of
   inline text goes through the Inline component. Prose is set at the one reading size
   (--t-read, never below 16px); code blocks are the one exception, at --t-code.
   Long unbroken strings may break anywhere only in code and link text; prose breaks a word
   only when it can't fit at all, and table cells never break inside a word or a number range.
   Every value is a token from tokens.css. */
.md { min-width: 0; font-family: var(--f-read); font-size: var(--t-read); line-height: var(--lh-read); overflow-wrap: break-word; }
.md .il-code { overflow-wrap: anywhere; }
.md p, .md ul, .md ol, .md blockquote, .md .code, .md .h, .md .sxw { margin: 0 0 0.75em; }
.md > :last-child { margin-bottom: 0; }

/* headings: level 1 (when it isn't the item's own name) and 2 share the larger style; 3 and 4
   are the reading size in bold. A rule right before a level-2 heading is its hairline. */
.md .h { font-family: var(--f-display); font-weight: var(--dw-strong); letter-spacing: var(--dls); line-height: var(--lh-title); }
.md .h-2 { margin-top: 1.8em; padding-top: 0.7em; border-top: 1px solid var(--line); font-size: var(--t-h2); }
.md .h-3 { margin-top: 1.2em; font-size: var(--t-read); }
.md > .h:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.md hr { height: 0; margin: 1.6em 0; border: 0; border-top: 1px solid var(--line-2); }
.md hr:has(+ .h-2) { display: none; }

.md ul, .md ol { padding-left: 1.3em; }
.md li + li { margin-top: 0.2em; }
.md li.sub { margin-left: 1.3em; list-style-type: circle; }
.md blockquote { padding: 0 0 0 var(--s3); border-left: 3px solid var(--line-2); font-style: italic; }

/* boxes that scroll sideways (code blocks and wide tables): a fade on the right edge while
   more is hidden (data-more="1" on the wrapper, set after render and while it scrolls), and the
   one focus ring, so the arrow keys can scroll them */
.md .sxw { position: relative; }
.md .sx:focus-visible { outline: 2px solid var(--acc-ink); outline-offset: 2px; }
.md .sxw[data-more="1"]::after { content: ''; position: absolute; top: 1px; right: 1px; bottom: 1px; width: calc(var(--s6) + var(--s4)); border-radius: 0 var(--r2) var(--r2) 0; background: linear-gradient(to right, transparent, var(--fade-to)); pointer-events: none; }

/* code blocks: one size, scroll sideways, and fold to --code-show lines behind "Show all N
   lines" when longer than CODE_FOLD_OVER lines */
.md .code .sxw { --fade-to: var(--surface-2); margin: 0; }
.md pre { margin: 0; padding: var(--code-pad-y) var(--code-pad-x); overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r2); background: var(--surface-2); font-family: var(--f-mono); font-size: var(--t-code); line-height: var(--lh-code); }
.md pre code { white-space: pre; overflow-wrap: normal; }
.md .code.folded pre { max-height: calc(var(--t-code) * var(--lh-code) * var(--code-show) + var(--code-pad-y) * 2); overflow-y: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 75%, transparent); mask-image: linear-gradient(to bottom, #000 75%, transparent); }
.md .code-more { min-height: var(--ctl-h); margin-top: var(--s1); padding: 0; border: 0; border-radius: var(--r2); background: transparent; color: var(--acc-ink); cursor: pointer; font-family: var(--f-ui); font-size: var(--t-meta); text-decoration: underline; text-underline-offset: 2px; }
.md .code-more:focus-visible { outline: 2px solid var(--acc-ink); outline-offset: 2px; }

/* tables: cells wrap between words only; a table whose words can't fit scrolls sideways */
.md .tblw { --fade-to: var(--reader-bg); }
.md .tbl { overflow-x: auto; }
.md table { min-width: min-content; border-collapse: collapse; font-family: var(--f-ui); font-size: inherit; }
.md th, .md td { padding: var(--s1) var(--s3); border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; overflow-wrap: normal; word-break: normal; }
.md th .il-a, .md td .il-a, .md th .il-code, .md td .il-code { overflow-wrap: normal; }
</style>
</helmet>
<div class="md" id="{{uid}}">
<sc-for list="{{blocks}}" as="b" hint-placeholder-count="2">
<sc-if value="{{b.isP}}" hint-placeholder-val="{{ true }}"><p><dc-import name="Inline" spans="{{b.spans}}" hint-size="100%,1.6em"></dc-import></p></sc-if>
<sc-if value="{{b.isH4}}" hint-placeholder-val="{{ false }}"><h4 class="h {{b.hCls}}"><dc-import name="Inline" spans="{{b.spans}}" hint-size="100%,1.4em"></dc-import></h4></sc-if>
<sc-if value="{{b.isH5}}" hint-placeholder-val="{{ false }}"><h5 class="h {{b.hCls}}"><dc-import name="Inline" spans="{{b.spans}}" hint-size="100%,1.4em"></dc-import></h5></sc-if>
<sc-if value="{{b.isH6}}" hint-placeholder-val="{{ false }}"><h6 class="h {{b.hCls}}"><dc-import name="Inline" spans="{{b.spans}}" hint-size="100%,1.4em"></dc-import></h6></sc-if>
<sc-if value="{{b.isHr}}" hint-placeholder-val="{{ false }}"><hr></sc-if>
<sc-if value="{{b.isQuote}}" hint-placeholder-val="{{ false }}"><blockquote><dc-import name="Inline" spans="{{b.spans}}" hint-size="100%,1.6em"></dc-import></blockquote></sc-if>
<sc-if value="{{b.isUl}}" hint-placeholder-val="{{ false }}"><ul><sc-for list="{{b.items}}" as="li" hint-placeholder-count="2"><li class="{{li.cls}}"><dc-import name="Inline" spans="{{li.spans}}" hint-size="100%,1.6em"></dc-import></li></sc-for></ul></sc-if>
<sc-if value="{{b.isOl}}" hint-placeholder-val="{{ false }}"><ol><sc-for list="{{b.items}}" as="li" hint-placeholder-count="2"><li class="{{li.cls}}"><dc-import name="Inline" spans="{{li.spans}}" hint-size="100%,1.6em"></dc-import></li></sc-for></ol></sc-if>
<sc-if value="{{b.isCode}}" hint-placeholder-val="{{ false }}"><div class="code {{b.foldCls}}"><div class="sxw"><pre class="sx" tabindex="0" role="region" aria-label="{{b.codeLabel}}"><code>{{b.text}}</code></pre></div><sc-if value="{{b.canFold}}" hint-placeholder-val="{{ false }}"><button type="button" class="code-more" aria-expanded="{{b.expanded}}" onClick="{{b.toggle}}">{{b.foldLabel}}</button></sc-if></div></sc-if>
<sc-if value="{{b.isTable}}" hint-placeholder-val="{{ false }}"><div class="sxw tblw"><div class="tbl sx" data-label="{{b.tableLabel}}"><table><thead><tr><sc-for list="{{b.head}}" as="c" hint-placeholder-count="2"><th><dc-import name="Inline" spans="{{c}}" hint-size="4em,1.4em"></dc-import></th></sc-for></tr></thead><tbody><sc-for list="{{b.rows}}" as="row" hint-placeholder-count="2"><tr><sc-for list="{{row}}" as="c" hint-placeholder-count="2"><td><dc-import name="Inline" spans="{{c}}" hint-size="4em,1.4em"></dc-import></td></sc-for></tr></sc-for></tbody></table></div></div></sc-if>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"blocks":{"editor":null},"$preview":{"width":480,"height":160}}'>
// blocks: the facts from data.json ({ type, level, spans | items | text | head, rows }).
// Spans go to Inline untouched; this file adds the block flags its template needs.
// Heading levels map to h4 (1 and 2), h5 (3) and h6 (4): the reader's own title is h2 and its
// section labels h3. Which code blocks are unfolded is this file's state. Whether a code block
// or table can scroll further right is read from the page after render, once the fonts are
// ready, when this text's width changes and while a box scrolls; a table that scrolls also
// becomes focusable then (a code block always is).
var CODE_FOLD_OVER = 20;   // a longer block folds to --code-show lines (tokens.css)
// In a table cell a number range ("30–40", "1-3") stays on one line: a word joiner after its dash.
function keepRanges(cell) { return (cell || []).map(function (sp) { return Object.assign({}, sp, { text: String(sp.text).replace(/(\d)([\u2013\u2014-])(?=\d)/g, '$1$2\u2060') }); }); }
var HEADING = { 1: { tag: 4, cls: 'h-2' }, 2: { tag: 4, cls: 'h-2' }, 3: { tag: 5, cls: 'h-3' }, 4: { tag: 6, cls: 'h-3' } };
var count = 0;
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.uid = 'md-' + (++count);
    this.state = { open: {} };
    var self = this;
    this.check = function () { if (!self._raf) self._raf = requestAnimationFrame(function () { self._raf = 0; self.fades(); }); };
  }
  componentDidMount() {
    var self = this;
    this.watch();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { self.check(); });
  }
  componentDidUpdate() { this.watch(); }
  componentWillUnmount() {
    if (this._root) this._root.removeEventListener('scroll', this.check, true);
    if (this._ro) this._ro.disconnect();
    cancelAnimationFrame(this._raf);
  }
  // Only a Text with a code block or a table listens: to its boxes' sideways scrolling and its width.
  watch() {
    var root = document.getElementById(this.uid);
    if (!root || !root.querySelector('.sx')) return;
    if (root !== this._root) {
      this._root = root;
      root.addEventListener('scroll', this.check, true);
      if (typeof ResizeObserver !== 'undefined') { this._ro = new ResizeObserver(this.check); this._ro.observe(root); }
    }
    this.fades();
  }
  fades() {
    var root = this._root;
    if (!root) return;
    root.querySelectorAll('.sxw').forEach(function (box) {
      var sx = box.querySelector('.sx'), wide = sx.scrollWidth > sx.clientWidth + 1, more = sx.scrollLeft + sx.clientWidth < sx.scrollWidth - 1;
      if ((box.getAttribute('data-more') === '1') !== more) box.setAttribute('data-more', more ? '1' : '0');
      if (sx.classList.contains('tbl')) {   // a table is a focus stop only while it can scroll
        if (wide && !sx.hasAttribute('tabindex')) { sx.setAttribute('tabindex', '0'); sx.setAttribute('role', 'region'); sx.setAttribute('aria-label', sx.getAttribute('data-label')); }
        if (!wide && sx.hasAttribute('tabindex')) { sx.removeAttribute('tabindex'); sx.removeAttribute('role'); sx.removeAttribute('aria-label'); }
      }
    });
  }
  toggle(i) {
    var o = Object.assign({}, this.state.open);
    if (o[i]) delete o[i]; else o[i] = true;
    this.setState({ open: o });
  }
  renderVals() {
    var self = this, open = this.state.open;
    var blocks = Array.isArray(this.props.blocks) ? this.props.blocks : [];
    return {
      uid: this.uid,
      blocks: blocks.map(function (b, i) {
        var t = b.type, H = t === 'h' ? HEADING[b.level] || HEADING[3] : null;
        var lines = t === 'code' ? b.text.split('\n').length : 0, can = lines > CODE_FOLD_OVER, on = !!open[i];
        var cols = t === 'table' ? (b.head || []).length : 0;
        return {
          isP: t === 'p', isH4: !!H && H.tag === 4, isH5: !!H && H.tag === 5, isH6: !!H && H.tag === 6, hCls: H ? H.cls : '',
          isHr: t === 'hr', isQuote: t === 'quote', isUl: t === 'ul', isOl: t === 'ol', isCode: t === 'code', isTable: t === 'table',
          spans: b.spans || [], text: b.text || '', head: (b.head || []).map(keepRanges), rows: (b.rows || []).map(function (r) { return r.map(keepRanges); }),
          items: (b.items || []).map(function (it) { return { cls: it.level ? 'sub' : '', spans: it.spans }; }),
          codeLabel: 'Code, ' + lines + (lines === 1 ? ' line' : ' lines'), tableLabel: 'Table, ' + cols + ' columns',
          canFold: can, foldCls: can && !on ? 'folded' : '', expanded: LIB.pressed(on),
          foldLabel: on ? 'Show fewer lines' : 'Show all ' + lines + ' lines', toggle: function () { self.toggle(i); }
        };
      })
    };
  }
}
</script>
</body>
</html>
