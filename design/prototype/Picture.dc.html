<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Item picture</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tokens.css">
<style>
body{margin:0}
[data-sc-name="Picture"] { display: block; width: 100%; height: 100%; }   /* fills the crop box it is placed in */
/* One picture. Crops keep the top-left corner, where a screenshot's first line starts.
   Dark theme: 90% brightness and a 1px border. */
.pic { display: block; width: 100%; height: 100%; object-fit: cover; object-position: left top; }
.th-dark .pic { filter: brightness(0.9); border: 1px solid var(--line-2); }
</style>
</helmet>
<sc-if value="{{has}}" hint-placeholder-val="{{ false }}"><img class="pic" src="{{src}}" alt="{{alt}}" decoding="async"></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"file":{"editor":"text"},"alt":{"editor":null},"$preview":{"width":320,"height":320}}'>
// file: the image's file name from data.json (item.image.file); images live in project/img.
// No file, no picture.
// The blob cache exists only for the design canvas, whose frame can't load a relative image
// path built at run time: each file is read once through the canvas's fetch and shared by
// every Picture. Anywhere that fetch can't serve it, the plain relative path is used.
var CACHE = {};
function load(file) {
  if (!CACHE[file]) {
    CACHE[file] = fetch('./img/' + file)
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.blob(); })
      .then(function (b) { return URL.createObjectURL(b); })
      .catch(function () { return './img/' + file; });
  }
  return CACHE[file];
}
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { src: '', file: '' };
  }
  componentDidMount() { this.resolve(); }
  componentDidUpdate() { this.resolve(); }
  resolve() {
    var self = this, file = this.props.file || '';
    if (file === this._asked) return;
    this._asked = file;
    if (!file) { this.setState({ src: '', file: '' }); return; }
    load(file).then(function (src) { if (self._asked === file) self.setState({ src: src, file: file }); });
  }
  renderVals() {
    var ok = !!this.props.file && this.state.file === this.props.file;
    return { has: ok && !!this.state.src, src: this.state.src, alt: this.props.alt || '' };
  }
}
</script>
</body>
</html>
